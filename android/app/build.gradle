plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

// Firebase push: only when android/app/google-services.json is present
// (kept out of git; CI writes it from the GOOGLE_SERVICES_JSON secret).
if (file("google-services.json").exists()) {
    apply plugin: "com.google.gms.google-services"
}

// Release signing (Play Store upload key):
//  • locally from android/key.properties (git-ignored)
//  • in CI from env vars ANDROID_KEYSTORE_PATH / _PASSWORD / ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD
def keyProps = new Properties()
def keyPropsFile = rootProject.file("key.properties")
if (keyPropsFile.exists()) keyPropsFile.withInputStream { keyProps.load(it) }
def signingValue = { String prop, String env -> keyProps.getProperty(prop) ?: System.getenv(env) }
def releaseStoreFile = signingValue("storeFile", "ANDROID_KEYSTORE_PATH")

android {
    namespace "com.dishaanhitech.erp_mobile"
    compileSdk flutter.compileSdkVersion
    ndkVersion "26.3.11579264"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        applicationId "com.dishaanhitech.erp_mobile"
        minSdkVersion flutter.minSdkVersion
        targetSdk flutter.targetSdkVersion
        // from pubspec.yaml "version: x.y.z+N" (CI overrides N with --build-number)
        versionCode flutter.versionCode
        versionName flutter.versionName
    }

    signingConfigs {
        if (releaseStoreFile) {
            release {
                storeFile file(releaseStoreFile)
                storePassword signingValue("storePassword", "ANDROID_KEYSTORE_PASSWORD")
                keyAlias signingValue("keyAlias", "ANDROID_KEY_ALIAS")
                keyPassword signingValue("keyPassword", "ANDROID_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            // Without an upload key, release builds fall back to the debug key
            // (fine for testing, rejected by the Play Store).
            signingConfig releaseStoreFile ? signingConfigs.release : signingConfigs.debug
        }
    }
}

flutter {
    source "../.."
}

dependencies {
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.4"
}
